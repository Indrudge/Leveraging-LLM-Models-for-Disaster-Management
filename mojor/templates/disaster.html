{% extends 'nevbar.html' %}
{% load static %}

{% block head %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'css/disastep.css' %}">
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const loadingOverlay = document.getElementById("loading-overlay");
        const mainContent = document.getElementById("main-content");

        // Simulate a short loading time before revealing the content
        setTimeout(() => {
            loadingOverlay.style.opacity = "0"; // Fade out
            loadingOverlay.style.pointerEvents = "none";
            mainContent.style.opacity = "1"; // Fade in
        }, 2000); // Adjust the time as needed
    });
</script>
{% endblock %}

{% block body %}
<!-- Loading Screen -->
<div id="loading-overlay" class="loading-overlay">
    <div class="disaster-loading-icon">
        <div class="spinner"></div>
    </div>
    <p>Loading... Preparing disaster details...</p>
</div>

<!-- Main Content -->
<div id="main-content" class="hidden">
    <div class="container">
        <h1 class="disaster-title">{{ disaster.location }}, {{ disaster.title }}</h1>
        <p class="disaster-details">{{ disaster.details }}</p>
        <a href="{% url 'map' %}" class="ebut">See Map</a>
        <a href="{% url 'disasterlist' %}" class="ebut">See Other Disasters</a>
    </div>
</div>
{% endblock %}
