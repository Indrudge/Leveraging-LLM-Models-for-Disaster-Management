{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disaster Portal</title>
  <link rel="icon" type="image/x-icon" href="{% static 'images/icon.png' %}">
  <link rel="stylesheet" href="{% static 'css/nevbar.css' %}">
  {% block head %}{% endblock %}
</head>
<script>
    document.addEventListener("DOMContentLoaded", () => {
      const navLinks = document.querySelector(".nav-links");
      const navToggle = document.createElement("button"); // Use a button for better accessibility
      navToggle.className = "nav-toggle";
      navToggle.innerHTML = "&#9776;"; // Hamburger menu icon
      document.querySelector(".navbar").appendChild(navToggle);
  
      navToggle.addEventListener("click", () => {
        navLinks.classList.toggle("active");
      });
    });
  </script>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <a href="#This_thing_Don't_Work">Disaster Portal </a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="{% url 'disasterlist'%}">Disaster list</a></li>
        <li><a href="{% url 'about'%}">About</a></li>
        <li><a href="{% url 'contact'%}">Contact</a></li>
      </ul>
      <!-- Toggle button will be injected by JavaScript -->
    </nav>
  </header>
  {% block body %}{% endblock %}
</body>
</html>
