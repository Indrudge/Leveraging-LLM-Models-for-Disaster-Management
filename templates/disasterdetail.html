{% extends 'nevbar.html' %}

{% load static %}

{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/disasterdetail.css' %}">
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: 'Arial', sans-serif;
            transition: opacity 0.5s ease-in-out;
        }
        
        .hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }
        
        .disaster-loading-icon {
            position: relative;
            margin-bottom: 20px;
            width: 80px;
            height: 80px;
        }
        
        /* Spinner for Loading Animation */
        .spinner {
            width: 80px;
            height: 80px;
            border: 10px solid rgba(255, 255, 255, 0.3);
            border-top: 10px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        /* Pulsating Text for Loading */
        .loading-overlay p {
            animation: pulse 1.5s infinite;
            font-size: 1.2rem;
            text-align: center;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
{% endblock %}

{% block body %}
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-overlay">
        <div class="disaster-loading-icon">
            <div class="spinner"></div>
        </div>
        <p>Loading... Preparing disaster details...</p>
    </div>

    <!-- Main Content -->
    <section class="disaster-details" style="display: none;">
        <h2>{{ disaster.type }} in {{ disaster.location }}</h2>
        <p><strong>Details:</strong> {{ disaster.details }}</p>
        <a href="/disasterlist">Back to List</a>
        <a href="{% url 'map' %}">See Map</a>
    </section>

    <script>
        // JavaScript to handle loading screen
        document.addEventListener("DOMContentLoaded", function () {
            const loadingScreen = document.getElementById("loading-screen");
            const mainContent = document.querySelector(".disaster-details");

            // Simulate loading time, then hide the loading screen
            setTimeout(() => {
                loadingScreen.classList.add("hidden");
                mainContent.style.display = "block";
            }, 1000); // Adjust the time as needed
        });
    </script>
{% endblock %}
