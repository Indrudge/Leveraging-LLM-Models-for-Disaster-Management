{% load static %}

{% block head %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <link rel="stylesheet" href="{% static 'css/loader.css' %}">
  <script>
    // Redirect to the actual page after the loading animation
    setTimeout(() => {
      window.location.href = "{{ next_url }}";
    }, 3000); // Adjust delay as needed
  </script>
  {% endblock %}
  {% block body %}
  <div id="loading-screen">
    <div class="loader">
      <!-- Rain Theme -->
      <div id="theme-rain" class="loading-theme hidden">
        <div class="raindrop"></div>
        <div class="raindrop"></div>
        <div class="raindrop"></div>
      </div>

      <!-- Landslide Theme -->
      <div id="theme-landslide" class="loading-theme hidden">
        <div class="landslide"></div>
      </div>

      <!-- Earthquake Theme -->
      <div id="theme-earthquake" class="loading-theme hidden">
        <div class="earthquake-shake">Earthquake</div>
      </div>

      <!-- Tornado Theme -->
      <div id="theme-tornado" class="loading-theme hidden">
        <div class="tornado">
          <div class="swirl"></div>
          <div class="swirl"></div>
          <div class="swirl"></div>
        </div>
      </div>

      <!-- Wildfire Theme -->
      <div id="theme-wildfire" class="loading-theme hidden">
        <div class="flame"></div>
        <div class="flame"></div>
        <div class="flame"></div>
      </div>

      <!-- Tsunami Theme -->
      <div id="theme-tsunami" class="loading-theme hidden">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // List of available themes
      const themes = [
        "theme-rain",
        "theme-landslide",
        "theme-earthquake",
        "theme-tornado",
        "theme-wildfire",
        "theme-tsunami",
      ];

      // Randomly select a theme
      const selectedTheme = themes[Math.floor(Math.random() * themes.length)];

      // Hide all themes initially
      document.querySelectorAll(".loading-theme").forEach(theme => {
        theme.classList.add("hidden");
      });

      // Display the randomly selected theme
      const activeTheme = document.getElementById(selectedTheme);
      if (activeTheme) {
        activeTheme.classList.remove("hidden");
      }

      // Simulate a loading delay, then redirect to the actual page
      const redirectDelay = 3000; // 3 seconds
      setTimeout(() => {
        const nextUrl = "{{ next_url }}";
        if (nextUrl) {
            window.location.href = nextUrl;
        } else {
            console.error("No next_url provided for redirection.");
        }
    }, 3000);
})    
  </script>
  {% endblock %}
